# ============================================================
# Telón - Pipeline de integración continua
# Para: Telón TV
# De: Albert Alvear - Desarrollador, Analista de datos, hacker e ingeniero de software pragmático
#
# Primero lo rápido y determinista (lint y unitarias), después aceptación, flujo e
# interfaz, y al final el build de Android y el paquete de Samsung. Cualquier paso que
# falle bloquea la integración. Las pruebas de mutación corren aparte (mutacion.yml).
# ============================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: App web (lint, pruebas, interfaz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Pruebas unitarias y de propiedades
        run: npm run test:unit
      - name: Pruebas de aceptación (Gherkin)
        run: npm run test:bdd
      - name: Chromium para las pruebas de interfaz
        run: npx playwright-core install --with-deps chromium
      - name: Pruebas de flujo, paquete Samsung e interfaz en 4 tamaños
        run: npm run test:e2e
      - name: Cobertura (señal, no meta)
        run: npm run coverage
      - name: Dependencias con vulnerabilidades conocidas
        run: npm audit --audit-level=high
      - name: Capturas de pantalla para revisar en el PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: build/capturas/

  android:
    name: Android (lint, JUnit, APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint de Android (cualquier advertencia rompe el build), JUnit y APK debug
        run: bash gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  samsung:
    name: Samsung (.wgt sin firmar)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La firma necesita el certificado de distribuidor de Samsung, que no vive en el repo.
      - run: npm run build:tizen
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-sin-firmar
          path: build/tizen/
