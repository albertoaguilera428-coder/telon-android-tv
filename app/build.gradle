// ============================================================
// Telón - Build de la app Android
// Para: Telón TV
// De: Albert Alvear - Desarrollador, Analista de datos, hacker e ingeniero de software pragmático
//
// La firma de release se lee de keystore.properties (fuera de git). Si no existe, el
// release sale sin firmar en vez de firmarse con la clave de debug, que es pública.
//
// La app web (web/) se empaqueta con Node antes de armar el APK: hace falta haber corrido
// `npm ci` una vez (ver README).
// ============================================================
plugins {
    id 'com.android.application'
}

// ============================================================
// FIRMA DE RELEASE
// ============================================================
def archivoFirma = rootProject.file('keystore.properties')
def propiedadesFirma = new Properties()
if (archivoFirma.exists()) {
    archivoFirma.withInputStream { propiedadesFirma.load(it) }
}

android {
    namespace 'app.telon.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.telon.tv'
        minSdk 26
        targetSdk 34
        // Igual a VERSION_TELON de web/js/app/update-service.js. Android solo instala una
        // actualización encima si este número no baja y la firma es la misma.
        versionCode 3
        versionName '3.0'
    }
    signingConfigs {
        release {
            if (archivoFirma.exists()) {
                storeFile rootProject.file(propiedadesFirma['storeFile'])
                storePassword propiedadesFirma['storePassword']
                keyAlias propiedadesFirma['keyAlias']
                keyPassword propiedadesFirma['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (archivoFirma.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // ============================================================
    // PUERTAS DE CALIDAD
    // ============================================================
    // Una advertencia nueva rompe el build: las que aceptamos a conciencia están en lint.xml con su porqué.
    lint {
        abortOnError true
        warningsAsErrors true
        lintConfig file('lint.xml')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// ============================================================
// APP WEB
// ============================================================
// El WebView carga la app desde file://, donde no se pueden cargar módulos ES: se juntan en
// un solo telon.js con scripts/empaquetar-web.mjs y el resultado entra al APK como assets/www.
abstract class EmpaquetarWeb extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getFuentes()

    @InputFile @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getScript()

    @OutputDirectory
    abstract DirectoryProperty getSalida()

    @Inject
    abstract ExecOperations getEjecucion()

    @TaskAction
    void empaquetar() {
        ejecucion.exec {
            commandLine 'node', script.get().asFile.absolutePath, salida.get().dir('www').asFile.absolutePath
        }
    }
}

def tareaWeb = tasks.register('empaquetarWeb', EmpaquetarWeb) {
    description = 'Junta web/js en un solo telon.js para el WebView (scripts/empaquetar-web.mjs).'
    fuentes = rootProject.layout.projectDirectory.dir('web')
    script = rootProject.layout.projectDirectory.file('scripts/empaquetar-web.mjs')
    salida = layout.buildDirectory.dir('generated/web')
}

androidComponents {
    onVariants(selector().all()) { variante ->
        variante.sources.assets.addGeneratedSourceDirectory(tareaWeb, { it.salida })
    }
}
