<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Telón</title>
<link rel="stylesheet" href="style.css">
<script>
const FIREBASE_API_KEY = "AIzaSyBuT4FxjE8LYRasc5EOjFGcdgZb3IToK7E";
const _fbUrl = (ep) => `https://identitytoolkit.googleapis.com/v1/accounts:${ep}?key=${FIREBASE_API_KEY}`;
const _fbPost = (ep, body) => fetch(_fbUrl(ep), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(async r => { const j = await r.json(); if (j.error) throw { code: j.error.message }; return j; });
const firebase = { auth() { return firebase._auth; }, _auth: {
  _user: null, _listeners: [],
  currentUser: null,
  onAuthStateChanged(cb) { this._listeners.push(cb); cb(this.currentUser); },
  _notify() { this._listeners.forEach(cb => cb(this.currentUser)); },
  async createUserWithEmailAndPassword(email, pass) {
    const j = await _fbPost('signUp', { email, password: pass, returnSecureToken: true });
    const user = { uid: j.localId, email: j.email, displayName: '', emailVerified: false, _idToken: j.idToken, _refreshToken: j.refreshToken,
      updateProfile: (p) => _fbPost('update', { idToken: j.idToken, displayName: p.displayName, returnSecureToken: false }).then(() => { user.displayName = p.displayName; }),
      sendEmailVerification: () => _fbPost('sendOobCode', { requestType: 'VERIFY_EMAIL', idToken: j.idToken }) };
    this.currentUser = user; this._notify();
    return { user };
  },
  async signInWithEmailAndPassword(email, pass) {
    const j = await _fbPost('signInWithPassword', { email, password: pass, returnSecureToken: true });
    const user = { uid: j.localId, email: j.email, displayName: j.displayName || '', emailVerified: j.emailVerified || false, _idToken: j.idToken, _refreshToken: j.refreshToken,
      sendEmailVerification: () => _fbPost('sendOobCode', { requestType: 'VERIFY_EMAIL', idToken: j.idToken }) };
    this.currentUser = user; this._notify();
    return { user };
  },
  signOut() { this.currentUser = null; this._notify(); return Promise.resolve(); }
}};
</script>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav id="nav" aria-label="Navegación principal"></nav>
</div>
<div id="detail" hidden></div>
<div id="player" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
